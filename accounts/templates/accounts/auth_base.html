{% load static %}
<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HoldMyResume — Account Access</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-full bg-white text-black font-sans antialiased selection:bg-black selection:text-white">

  <div class="h-full w-full flex flex-col lg:flex-row overflow-hidden">
    
    <!-- Left Hero Banner / Cover Section (Desktop Only) -->
    <div class="hidden lg:flex lg:w-3/5 xl:w-2/3 bg-neutral-50/60 relative items-center justify-center border-r border-black/10 select-none p-16 overflow-hidden">
      <!-- Subtle Background Grid Pattern -->
      <div class="absolute inset-0 bg-[linear-gradient(to_right,#00000008_1px,transparent_1px),linear-gradient(to_bottom,#00000008_1px,transparent_1px)] bg-[size:32px_32px]"></div>

      <!-- Hero Branding Centerpiece -->
      <div class="relative z-10 flex flex-col items-center text-center gap-6 max-w-xl transition-all duration-300">
        <img 
          src="{% static 'images/logo-icon.png' %}" 
          alt="Logo Icon" 
          class="w-32 h-32 xl:w-40 xl:h-40 object-contain drop-shadow-[0_10px_20px_rgba(0,0,0,0.06)] hover:scale-105 transition-transform duration-300" 
        />
        <img 
          src="{% static 'images/logo-name.png' %}" 
          alt="HoldMyResume" 
          class="h-16 xl:h-20 w-auto object-contain" 
        />
      </div>
    </div>

    <!-- Right Form Section -->
    <div class="w-full lg:w-2/5 xl:w-1/3 h-full flex flex-col justify-between items-center p-6 sm:p-10 lg:p-12 bg-white overflow-y-auto">
      
      <!-- Top spacing anchor for mobile -->
      <div class="w-full max-w-sm shrink-0"></div>

      <!-- Centered Form Container -->
      <div class="w-full max-w-sm my-auto py-4 space-y-6 flex flex-col justify-center">
        
        <!-- Mobile-Only Logo (Hidden on Desktop) -->
        <div class="flex lg:hidden items-center gap-3 pb-2">
          <img 
            src="{% static 'images/logo-icon.png' %}" 
            alt="Logo Icon" 
            class="w-10 h-10 object-contain shrink-0" 
          />
          <img 
            src="{% static 'images/logo-name.png' %}" 
            alt="HoldMyResume" 
            class="h-7 w-auto object-contain" 
          />
        </div>

        <!-- Messages Display -->
        {% if messages %}
          <div class="space-y-2">
            {% for message in messages %}
              <div class="p-3 text-xs font-semibold rounded-xl border border-rose-200 bg-rose-50 text-rose-700">
                {{ message }}
              </div>
            {% endfor %}
          </div>
        {% endif %}

        {% block content %}{% endblock content %}

      </div>

      <!-- Footer Policy Links -->
      <div class="py-3 text-center text-[11px] text-neutral-400 max-w-sm w-full shrink-0">
        By continuing, you agree to our <a href="#" class="underline hover:text-black transition">Terms</a> and <a href="#" class="underline hover:text-black transition">Privacy Policy</a>.
      </div>

    </div>
  </div>

</body>
</html>
