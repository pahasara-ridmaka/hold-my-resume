{% extends "accounts/auth_base.html" %}

{% block content %}
<div class="space-y-5 sm:space-y-6 text-center">
  <!-- Success Icon Badge -->
  <div class="w-12 h-12 sm:w-14 sm:h-14 mx-auto rounded-2xl border border-emerald-200 bg-emerald-50/80 text-emerald-600 flex items-center justify-center shadow-sm">
    <svg class="w-6 h-6 stroke-current" fill="none" viewBox="0 0 24 24" stroke-width="2.5">
      <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" />
    </svg>
  </div>

  <!-- Heading & Description -->
  <div class="space-y-1.5 sm:space-y-2">
    <h2 class="text-2xl sm:text-3xl font-extrabold tracking-tight text-black leading-tight">
      Password Updated
    </h2>
    <p class="text-xs sm:text-sm text-neutral-500 font-medium leading-relaxed max-w-xs mx-auto">
      Your password has been reset successfully. You can now access your account with your new credentials.
    </p>
  </div>

  <!-- Primary Action Button -->
  <div class="pt-2 sm:pt-3">
    <a
      href="{% url 'accounts:login' %}"
      class="w-full inline-flex items-center justify-center gap-2 bg-black text-white border border-black rounded-xl py-2.5 sm:py-2.5 px-4 text-xs font-bold tracking-wider uppercase hover:bg-neutral-800 active:scale-[0.99] transition shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] no-underline"
    >
      <span>Sign In Now</span>
      <svg class="w-3.5 h-3.5 stroke-current" fill="none" viewBox="0 0 24 24" stroke-width="2.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3" />
      </svg>
    </a>
  </div>
</div>
{% endblock content %}
