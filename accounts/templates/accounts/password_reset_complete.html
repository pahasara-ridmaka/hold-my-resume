{% extends "accounts/auth_base.html" %}

{% block content %}
<div class="space-y-5 text-center">
  <div class="w-10 h-10 mx-auto rounded-full border border-black/15 bg-neutral-50 flex items-center justify-center">
    <svg class="w-5 h-5 text-black" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
    </svg>
  </div>
  <h2 class="text-2xl font-extrabold tracking-tight text-black">Password Updated</h2>
  <p class="text-xs text-neutral-500 font-medium">Your password has been reset successfully.</p>
  <div class="pt-4">
    <a href="{% url 'accounts:login' %}" class="w-full inline-block bg-black text-white border border-black rounded-xl py-2.5 text-xs font-bold uppercase tracking-wider hover:bg-neutral-800 transition">
      Sign In Now
    </a>
  </div>
</div>
{% endblock content %}
