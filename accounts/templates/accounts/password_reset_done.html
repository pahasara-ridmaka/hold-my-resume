{% extends "accounts/auth_base.html" %}

{% block content %}
<div class="space-y-5 text-center">
  <div class="w-10 h-10 mx-auto rounded-full border border-black/15 bg-neutral-50 flex items-center justify-center">
    <svg class="w-5 h-5 stroke-current text-black" fill="none" viewBox="0 0 24 24" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
    </svg>
  </div>
  <h2 class="text-2xl font-extrabold tracking-tight text-black">Check your inbox</h2>
  <p class="text-xs text-neutral-500 font-medium leading-relaxed">
    If an account exists with that email, we've sent password reset instructions.
  </p>
  <div class="pt-4">
    <a href="{% url 'accounts:login' %}" class="inline-block border border-black/20 rounded-xl px-5 py-2 text-xs font-bold uppercase tracking-wider text-black hover:bg-neutral-100 transition">
      Return to Login
    </a>
  </div>
</div>
{% endblock content %}
