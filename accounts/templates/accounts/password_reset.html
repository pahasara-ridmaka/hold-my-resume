{% extends "accounts/auth_base.html" %}

{% block content %}
<div class="space-y-6">
  <div class="space-y-2">
    <span class="inline-flex items-center gap-1.5 border border-black/15 rounded-full px-3 py-0.5 text-[10px] font-bold tracking-wider uppercase bg-neutral-50/80 text-neutral-600">
      <span class="w-1.5 h-1.5 rounded-full bg-black"></span>
      Security
    </span>
    <h2 class="text-2xl font-extrabold tracking-tight text-black leading-tight">Reset Password</h2>
    <p class="text-xs font-medium text-neutral-500">Enter your email and we'll send you a recovery link.</p>
  </div>

  <form method="POST" class="space-y-4">
    {% csrf_token %}
    <div class="space-y-1.5">
      <label for="id_email" class="text-[10px] font-bold uppercase tracking-wider text-neutral-500 block">Email Address</label>
      <input
        type="email"
        name="email"
        id="id_email"
        required
        placeholder="jane@example.com"
        class="w-full border border-black/15 rounded-xl px-3.5 py-2.5 bg-neutral-50/50 text-xs sm:text-sm font-medium text-black placeholder-neutral-400 focus:outline-none focus:border-black focus:bg-white transition"
      />
    </div>

    <button type="submit" class="w-full bg-black text-white border border-black rounded-xl py-2.5 px-4 text-xs font-bold tracking-wider uppercase hover:bg-neutral-800 transition">
      Send Reset Link
    </button>
  </form>

  <div class="pt-2 text-center border-t border-black/10">
    <a href="{% url 'accounts:login' %}" class="text-xs font-bold text-neutral-600 hover:text-black hover:underline transition">Back to Login</a>
  </div>
</div>
{% endblock content %}
